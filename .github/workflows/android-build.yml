name: Build and Sign Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Version 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --no-daemon

      - name: Generate Signing Keystore on the fly
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-key-alias \
            -storepass "MiPassword123!" \
            -keypass "MiPassword123!" \
            -dname "CN=ControlVentasApp, OU=IT, O=Home, L=Unknown, ST=Unknown, C=US"

      - name: Sign APK with Android Build-Tools
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          $APKSIGNER sign \
            --ks release-key.jks \
            --ks-pass pass:"MiPassword123!" \
            --ks-key-alias "my-key-alias" \
            --out app-release-signed.apk \
            "$APK_PATH"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlVentasApp-Signed-APK
          path: app-release-signed.apk
