name: Build and Sign Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.pfx

      - name: Sign APK with Android Build-Tools
        run: |
          # Buscar la versión más reciente de apksigner disponible en el runner
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          
          # Buscar el APK generado
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          # Firmar el APK usando la clave PFX
          $APKSIGNER sign \
            --ks release-key.pfx \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app-release-signed.apk \
            "$APK_PATH"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlVentasApp-Signed-APK
          path: app-release-signed.apk
